apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-pulse
  labels:
    app: mlflow
    component: tracking-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        component: tracking-server
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: mlflow
          image: mlops-pulse/training:latest
          imagePullPolicy: Never
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5002
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --default-artifact-root=/mlflow/artifacts
            - --gunicorn-opts=--timeout=120
          env:
            - name: MLFLOW_FLASK_SERVER_SECRET_KEY
              value: "mlops-pulse-dev-key"
            - name: MLFLOW_ENABLE_PROXY_FIX
              value: "true"
          ports:
            - containerPort: 5002
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow
          readinessProbe:
            httpGet:
              path: /
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5002
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: mlflow-storage
          emptyDir: {}
 
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-pulse
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5002
      targetPort: 5002
  type: ClusterIP
 